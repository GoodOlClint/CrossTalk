name: harness-compat

on:
  workflow_dispatch:
    inputs:
      harness:
        description: harness to check (all, codex or claude-code)
        default: all
      version:
        description: force this x.y.z instead of the npm latest (one harness only)
        default: ""
      force:
        description: run even if the version equals the record
        type: boolean
        default: false
      recorded:
        description: treat this as the recorded version (a test aid)
        default: ""
      queue_codex_version:
        description: Codex version for the macOS queue-wake leg (the queue gate allows 0.167.x only); empty tests the candidate version itself
        default: "0.167.0"

permissions:
  contents: read

concurrency:
  group: harness-compat
  cancel-in-progress: false

jobs:
  check-updates:
    name: Check for updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      compare: ${{ steps.check.outputs.compare }}
      legs: ${{ steps.check.outputs.legs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        env:
          HARNESS: ${{ inputs.harness }}
          VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          RECORDED: ${{ inputs.recorded }}
          QUEUE_VERSION: ${{ inputs.queue_codex_version }}
        run: |
          set -eu
          changed="$(scripts/harness-compat.sh check-updates .github/harness-compat.json "$HARNESS" "$VERSION" "$FORCE" "$RECORDED")"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "changed: $changed"
          echo "compare=$(scripts/harness-compat.sh legs "$changed")" >> "$GITHUB_OUTPUT"
          echo "legs=$(scripts/harness-compat.sh legs "$changed" "$QUEUE_VERSION")" >> "$GITHUB_OUTPUT"

  compare:
    name: compare-${{ matrix.leg }}
    needs: check-updates
    if: needs.check-updates.outputs.changed != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-updates.outputs.compare) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the harness at the exact version
        env:
          HARNESS: ${{ matrix.harness }}
          VERSION: ${{ matrix.version }}
        run: |
          set -eu
          case "$HARNESS" in codex) pkg=@openai/codex ;; claude-code) pkg=@anthropic-ai/claude-code ;; *) exit 1 ;; esac
          npm install -g "$pkg@$VERSION"
      - name: Build crosstalk
        run: go build -o "$RUNNER_TEMP/bin/crosstalk" ./cmd/crosstalk
      - name: Install into a scratch HOME and check
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          set -eu
          home="$(mktemp -d /tmp/ct.XXXXXX)"
          echo "SCRATCH_HOME=$home" >> "$GITHUB_ENV"
          name=claude; [ "$HARNESS" = codex ] && name=codex
          HOME="$home" "$RUNNER_TEMP/bin/crosstalk" install "$name" --yes </dev/null
          HOME="$home" "$home/.local/bin/crosstalk" install "$name" --check </dev/null
      - name: Harness probes
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          set -eu
          if [ "$HARNESS" = codex ]; then
            q="$(scripts/harness-compat.sh compare-codex "$SCRATCH_HOME")"
            test -f "$q"
            CROSSTALK_COMPAT_QUEUE_DB="$q" go test ./internal/harness/codex -run TestInstalledCodexQueueSchema -count=1 -v
          else
            scripts/harness-compat.sh compare-claude "$SCRATCH_HOME"
          fi

  build:
    needs: check-updates
    if: needs.check-updates.outputs.changed != '[]'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          mkdir -p "$RUNNER_TEMP/out"
          go build -o "$RUNNER_TEMP/out/crosstalk" ./cmd/crosstalk
          go build -o "$RUNNER_TEMP/out/threaddump" ./scripts/threaddump
      - if: matrix.os == 'ubuntu-latest'
        run: go vet ./...
      - if: matrix.os == 'ubuntu-latest'
        run: go test ./cmd/crosstalk -run TestHarnessCompat -count=1
      - uses: actions/upload-artifact@v7
        with:
          name: crosstalk-bin-${{ matrix.os }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  harness:
    name: harness-${{ matrix.leg }}
    needs: [check-updates, compare, build]
    if: always() && needs.check-updates.outputs.changed != '[]' && needs.build.result == 'success'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-updates.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: harness-compat
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLAUDE_MODEL: ${{ vars.HARNESS_COMPAT_CLAUDE_MODEL }}
      CODEX_MODEL: ${{ vars.HARNESS_COMPAT_CODEX_MODEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require its compare job, the key and the models
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE: compare-${{ matrix.leg }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate --jq '.jobs[]' > "$RUNNER_TEMP/jobs.json"
          c="$(jq -rs --arg n "$COMPARE" 'map(select(.name == $n)) | .[0].conclusion // "missing"' "$RUNNER_TEMP/jobs.json")"
          if [ "$c" != success ]; then
            echo "::error::blocked: $COMPARE was $c"
            exit 1
          fi
          [ -n "$OPENROUTER_API_KEY" ] || { echo "::error::OPENROUTER_API_KEY is not set"; exit 1; }
          if [ -z "$CLAUDE_MODEL" ] || [ -z "$CODEX_MODEL" ]; then
            echo "::error::HARNESS_COMPAT_CLAUDE_MODEL and HARNESS_COMPAT_CODEX_MODEL must both be set"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: crosstalk-bin-${{ matrix.runner }}
          path: ${{ runner.temp }}/bin
      - name: Install the harness for this leg
        env:
          HARNESS: ${{ matrix.harness }}
          VERSION: ${{ matrix.version }}
        run: |
          set -eu
          case "$HARNESS" in
            claude-code) npm install -g "@anthropic-ai/claude-code@$VERSION"; claude --version ;;
            codex) npm install -g "@openai/codex@$VERSION"; codex --version ;;
            *) echo "unknown harness: $HARNESS" >&2; exit 1 ;;
          esac
      - name: Run the leg
        timeout-minutes: 20
        env:
          LEG: ${{ matrix.leg }}
        run: |
          set -eu
          chmod +x "$RUNNER_TEMP/bin/crosstalk" "$RUNNER_TEMP/bin/threaddump"
          home="$(mktemp -d /tmp/ct.XXXXXX)"
          CROSSTALK_BIN="$RUNNER_TEMP/bin/crosstalk" THREADDUMP_BIN="$RUNNER_TEMP/bin/threaddump" LIVE_LOGS="$RUNNER_TEMP/live-logs" scripts/harness-compat-live.sh leg "$LEG" "$home"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.leg }}
          path: ${{ runner.temp }}/live-logs
          if-no-files-found: ignore

  report:
    needs: [check-updates, harness]
    if: always() && needs.check-updates.outputs.changed != '[]'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: harness-compat
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    outputs:
      results: ${{ steps.report.outputs.results }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: report
        env:
          GH_TOKEN: ${{ github.token }}
          LEGS: ${{ needs.check-updates.outputs.legs }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate --jq '.jobs[]' > "$RUNNER_TEMP/jobs.json"
          results="$(scripts/harness-compat.sh report "$RUNNER_TEMP/jobs.json" "$LEGS")"
          echo "results=$results" >> "$GITHUB_OUTPUT"
          printf '%s' "$results" | jq -r 'to_entries[] | "\(.key) \(.value.version): \(if .value.pass then "PASS" else "NOT PASSED" end) (\(.value.legs | to_entries | map("\(.key)=\(.value)") | join(", ")))"' | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$OPENROUTER_API_KEY" ] || { echo "OpenRouter key usage: unavailable, no key" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          scripts/harness-compat-live.sh key-usage now "$RUNNER_TEMP" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "OpenRouter usage lags the spend: this run's cost is the next run's read minus this one." | tee -a "$GITHUB_STEP_SUMMARY"
