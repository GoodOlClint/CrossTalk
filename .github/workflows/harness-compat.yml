name: harness-compat

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      harness:
        description: harness to check (all, codex, claude-code or opencode)
        default: all
      version:
        description: force this x.y.z instead of the npm latest (one harness only)
        default: ""
      force:
        description: run even if the version equals the record
        type: boolean
        default: false
      recorded:
        description: treat this as the recorded version (a test aid)
        default: ""
      queue_codex_version:
        description: override the Codex version for the macOS queue-wake leg (a rehearsal aid); empty tests the candidate version itself
        default: ""

permissions:
  contents: read

concurrency:
  group: harness-compat
  cancel-in-progress: false

jobs:
  check-updates:
    name: Check for updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      compare: ${{ steps.check.outputs.compare }}
      legs: ${{ steps.check.outputs.legs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        env:
          HARNESS: ${{ inputs.harness || 'all' }}
          VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          RECORDED: ${{ inputs.recorded }}
          QUEUE_VERSION: ${{ inputs.queue_codex_version }}
        run: |
          set -eu
          changed="$(scripts/harness-compat.sh check-updates .github/harness-compat.json "$HARNESS" "$VERSION" "$FORCE" "$RECORDED")"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "changed: $changed"
          echo "compare=$(scripts/harness-compat.sh legs "$changed")" >> "$GITHUB_OUTPUT"
          echo "legs=$(scripts/harness-compat.sh legs "$changed" "$QUEUE_VERSION")" >> "$GITHUB_OUTPUT"

  compare:
    name: compare-${{ matrix.leg }}
    needs: check-updates
    if: needs.check-updates.outputs.changed != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-updates.outputs.compare) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the harness at the exact version
        env:
          HARNESS: ${{ matrix.harness }}
          VERSION: ${{ matrix.version }}
        run: |
          set -eu
          case "$HARNESS" in codex) pkg=@openai/codex ;; claude-code) pkg=@anthropic-ai/claude-code ;; opencode) pkg=@opencode/cli ;; *) exit 1 ;; esac
          npm install -g "$pkg@$VERSION"
      - name: Build crosstalk
        run: go build -o "$RUNNER_TEMP/bin/crosstalk" ./cmd/crosstalk
      - name: Install into a scratch HOME and check
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          set -eu
          home="$(mktemp -d /tmp/ct.XXXXXX)"
          echo "SCRATCH_HOME=$home" >> "$GITHUB_ENV"
          case "$HARNESS" in codex) name=codex ;; opencode) name=opencode ;; *) name=claude ;; esac
          HOME="$home" "$RUNNER_TEMP/bin/crosstalk" install "$name" --yes </dev/null
          HOME="$home" "$home/.local/bin/crosstalk" install "$name" --check </dev/null
      - name: Harness probes
        env:
          HARNESS: ${{ matrix.harness }}
          VERSION: ${{ matrix.version }}
        run: |
          set -eu
          case "$HARNESS" in
            codex)
              q="$(scripts/harness-compat.sh compare-codex "$SCRATCH_HOME")"
              test -f "$q"
              CROSSTALK_COMPAT_QUEUE_DB="$q" go test ./internal/harness/codex -run TestInstalledCodexQueueSchema -count=1 -v
              ;;
            opencode)
              CROSSTALK_BIN="$SCRATCH_HOME/.local/bin/crosstalk" scripts/harness-compat.sh compare-opencode "$SCRATCH_HOME" "$VERSION"
              ;;
            *)
              scripts/harness-compat.sh compare-claude "$SCRATCH_HOME"
              ;;
          esac

  build:
    needs: check-updates
    if: needs.check-updates.outputs.changed != '[]'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          mkdir -p "$RUNNER_TEMP/out"
          go build -o "$RUNNER_TEMP/out/crosstalk" ./cmd/crosstalk
          go build -o "$RUNNER_TEMP/out/threaddump" ./scripts/threaddump
      - if: matrix.os == 'ubuntu-latest'
        run: go vet ./...
      - if: matrix.os == 'ubuntu-latest'
        run: go test ./cmd/crosstalk -run TestHarnessCompat -count=1
      - uses: actions/upload-artifact@v7
        with:
          name: crosstalk-bin-${{ matrix.os }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  harness:
    name: harness-${{ matrix.leg }}
    needs: [check-updates, compare, build]
    if: always() && needs.check-updates.outputs.changed != '[]' && needs.build.result == 'success'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-updates.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: harness-compat
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLAUDE_MODEL: ${{ vars.HARNESS_COMPAT_CLAUDE_MODEL }}
      CODEX_MODEL: ${{ vars.HARNESS_COMPAT_CODEX_MODEL }}
      OPENCODE_MODEL: ${{ vars.HARNESS_COMPAT_OPENCODE_MODEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require its compare job, the key and the models
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE: compare-${{ matrix.leg }}
          HARNESS: ${{ matrix.harness }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate --jq '.jobs[]' > "$RUNNER_TEMP/jobs.json"
          c="$(jq -rs --arg n "$COMPARE" 'map(select(.name == $n)) | .[0].conclusion // "missing"' "$RUNNER_TEMP/jobs.json")"
          if [ "$c" != success ]; then
            echo "::error::blocked: $COMPARE was $c"
            exit 1
          fi
          [ -n "$OPENROUTER_API_KEY" ] || { echo "::error::OPENROUTER_API_KEY is not set"; exit 1; }
          case "$HARNESS" in
            claude-code) model="$CLAUDE_MODEL"; var=HARNESS_COMPAT_CLAUDE_MODEL ;;
            opencode) model="$OPENCODE_MODEL"; var=HARNESS_COMPAT_OPENCODE_MODEL ;;
            *) model="$CODEX_MODEL"; var=HARNESS_COMPAT_CODEX_MODEL ;;
          esac
          [ -n "$model" ] || { echo "::error::$var is not set"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: crosstalk-bin-${{ matrix.runner }}
          path: ${{ runner.temp }}/bin
      - name: Install the harness for this leg
        env:
          HARNESS: ${{ matrix.harness }}
          VERSION: ${{ matrix.version }}
        run: |
          set -eu
          case "$HARNESS" in
            claude-code) npm install -g "@anthropic-ai/claude-code@$VERSION"; claude --version ;;
            codex) npm install -g "@openai/codex@$VERSION"; codex --version ;;
            opencode) npm install -g "@opencode/cli@$VERSION"; [ "$(opencode --version)" = "opencode v$VERSION" ] || { echo "::error::opencode --version is not v$VERSION"; exit 1; } ;;
            *) echo "unknown harness: $HARNESS" >&2; exit 1 ;;
          esac
      - name: Run the leg
        timeout-minutes: 20
        env:
          LEG: ${{ matrix.leg }}
        run: |
          set -eu
          chmod +x "$RUNNER_TEMP/bin/crosstalk" "$RUNNER_TEMP/bin/threaddump"
          home="$(mktemp -d /tmp/ct.XXXXXX)"
          CROSSTALK_BIN="$RUNNER_TEMP/bin/crosstalk" THREADDUMP_BIN="$RUNNER_TEMP/bin/threaddump" LIVE_LOGS="$RUNNER_TEMP/live-logs" scripts/harness-compat-live.sh leg "$LEG" "$home"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.leg }}
          path: ${{ runner.temp }}/live-logs
          if-no-files-found: ignore

  report:
    needs: [check-updates, harness]
    if: always() && needs.check-updates.outputs.changed != '[]'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: harness-compat
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    outputs:
      results: ${{ steps.report.outputs.results }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: report
        env:
          GH_TOKEN: ${{ github.token }}
          LEGS: ${{ needs.check-updates.outputs.legs }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate --jq '.jobs[]' > "$RUNNER_TEMP/jobs.json"
          results="$(scripts/harness-compat.sh report "$RUNNER_TEMP/jobs.json" "$LEGS")"
          echo "results=$results" >> "$GITHUB_OUTPUT"
          printf '%s' "$results" | jq -r 'to_entries[] | "\(.key) \(.value.version): \(if .value.pass then "PASS" else "NOT PASSED" end) (\(.value.legs | to_entries | map("\(.key)=\(.value)") | join(", ")))"' | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$OPENROUTER_API_KEY" ]; then
            scripts/harness-compat-live.sh key-usage now "$RUNNER_TEMP" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "OpenRouter usage lags the spend: this run's cost is the next run's read minus this one." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "OpenRouter key usage: unavailable, no key" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fail the report job when a harness did not pass
        env:
          RESULTS: ${{ steps.report.outputs.results }}
        run: |
          printf '%s' "$RESULTS" | jq -e 'all(.[]; .pass)' >/dev/null || { echo "::error::a harness did not pass"; exit 1; }

  bump:
    name: Record passing versions
    needs: [check-updates, report]
    if: always() && needs.check-updates.outputs.changed != '[]' && needs.report.outputs.results != ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: harness-compat-bump
    steps:
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: GoodOlClint
          repositories: CrossTalk
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Bump the record and land it
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RESULTS: ${{ needs.report.outputs.results }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
        run: |
          set -eu
          git remote add upstream "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q upstream main "$GITHUB_SHA"
          scripts/harness-compat.sh tested-code "$GITHUB_SHA" upstream/main .github/harness-compat.json
          scripts/harness-compat.sh passing "$RESULTS" | while read -r h v; do
            branch="harness-compat-$h-$v"
            git fetch -q upstream main
            git checkout -q -B "$branch" upstream/main
            scripts/harness-compat.sh bump-record .github/harness-compat.json "$h" "$v" "$(date -u +%F)"
            if git diff --quiet -- .github/harness-compat.json; then
              echo "record already holds $h $v"
              continue
            fi
            git -c user.name='crosstalk-release[bot]' -c user.email='crosstalk-release[bot]@users.noreply.github.com' \
              commit -q -m "harness-compat: record $h $v as tested" .github/harness-compat.json
            scripts/release-build.sh land-bump "$GITHUB_REPOSITORY" "$branch" "harness-compat: record $h $v as tested" .github/harness-compat.json "$h" "$v" "$GITHUB_SHA"
          done

  issue:
    name: Open issues for failures
    needs: [check-updates, report]
    if: always() && needs.check-updates.outputs.changed != '[]' && needs.report.outputs.results != ''
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: File one issue per failing harness version
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ needs.report.outputs.results }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate --jq '.jobs[]' > "$RUNNER_TEMP/jobs.json"
          scripts/harness-compat.sh failing "$RESULTS" | while read -r h v; do
            scripts/harness-compat.sh file-issue "$GITHUB_REPOSITORY" "$h" "$v" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$RUNNER_TEMP/jobs.json"
          done
