name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify change
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          scope="$(scripts/release-build.sh ci-scope "$BASE" "$HEAD")"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "change scope: $scope"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fast tests (docs and marketplace changes only)
        if: steps.scope.outputs.scope == 'docs'
        run: go test ./cmd/crosstalk -run 'TestSetupDocCoversGaps|TestUpgradeFromBundledServerDocumented|TestManifestsMatchBinary|TestMarketplacesPinToReleaseTag|TestVersionIs015AndManifestsMatch|TestSiteConfig|TestSiteLinks|TestSiteNamesEveryTool|TestSkillCoversStatesAndCodes|TestEvalFixtureNoticesMatchConst|TestPluginShipsNoServer'
      - if: steps.scope.outputs.scope != 'docs'
        run: go build ./...
      - if: steps.scope.outputs.scope != 'docs'
        run: go test -race -timeout 20m ./...
      - if: steps.scope.outputs.scope != 'docs'
        run: go vet ./...
      - name: gofmt
        if: steps.scope.outputs.scope != 'docs'
        run: test -z "$(gofmt -l .)"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
