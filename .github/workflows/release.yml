name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    environment: release
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      final: ${{ steps.final.outputs.final }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check tag against mcpserver.Version
        run: scripts/release-build.sh check-tag "$TAG"
      - name: Classify tag
        id: final
        run: |
          set -eu
          final="$(scripts/release-build.sh is-final "$TAG")"
          echo "final=$final" >> "$GITHUB_OUTPUT"
      - name: Test
        run: go test ./...
      - name: Build universal binary
        run: scripts/release-build.sh build "$RUNNER_TEMP/dist"
      - name: Build Linux binaries
        run: scripts/release-build.sh build-linux "$RUNNER_TEMP/dist-linux"
      - name: Package Linux binaries
        run: scripts/release-build.sh package-linux "$RUNNER_TEMP/dist-linux" "$TAG"
      - name: Import signing certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/release-secrets"
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/release-secrets/cert.p12"
          security import "$RUNNER_TEMP/release-secrets/cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          chain=("$keychain")
          while IFS= read -r k; do chain+=("$k"); done < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          security list-keychains -d user -s "${chain[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          rm -f "$RUNNER_TEMP/release-secrets/cert.p12"
      - name: Sign with hardened runtime
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          scripts/release-build.sh check-identity "$RUNNER_TEMP/release-signing.keychain-db"
          codesign --force --timestamp --options runtime \
            --keychain "$RUNNER_TEMP/release-signing.keychain-db" \
            --sign "$APPLE_CODESIGN_IDENTITY" "$RUNNER_TEMP/dist/crosstalk"
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db"
      - name: Package
        run: scripts/release-build.sh package "$RUNNER_TEMP/dist" "$TAG"
      - name: Notarize
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER: ${{ secrets.AC_API_ISSUER }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/release-secrets"
          trap 'rm -f "$RUNNER_TEMP/release-secrets/key.p8"' EXIT
          printf '%s' "$AC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/release-secrets/key.p8"
          zip="$RUNNER_TEMP/dist/crosstalk-$TAG-macos-universal.zip"
          result="$RUNNER_TEMP/notary.json"
          xcrun notarytool submit "$zip" --wait --output-format json \
            --key "$RUNNER_TEMP/release-secrets/key.p8" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER" > "$result" || true
          cat "$result"
          status="$(plutil -extract status raw -o - "$result" 2>/dev/null || echo unknown)"
          if [ "$status" != "Accepted" ]; then
            id="$(plutil -extract id raw -o - "$result" 2>/dev/null || true)"
            [ -z "$id" ] || xcrun notarytool log "$id" \
              --key "$RUNNER_TEMP/release-secrets/key.p8" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER" || true
            echo "notarization status: $status" >&2
            exit 1
          fi
      - name: Verify signed binary
        run: |
          set -eu
          bin="$RUNNER_TEMP/dist/crosstalk"
          codesign --verify --strict --verbose=2 "$bin"
          codesign --verify --verbose=2 --check-notarization -R=notarized "$bin"
          spctl --assess --type execute --verbose=4 "$bin" || echo "spctl exit $? (a bare command-line binary is not an app bundle)"
          lipo -archs "$bin"
          "$bin" version
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          files=(
            "$RUNNER_TEMP/dist/crosstalk-$TAG-macos-universal.zip"
            "$RUNNER_TEMP/dist/crosstalk-$TAG-macos-universal.zip.sha256"
            "$RUNNER_TEMP/dist-linux/crosstalk-$TAG-linux-amd64.tar.gz"
            "$RUNNER_TEMP/dist-linux/crosstalk-$TAG-linux-amd64.tar.gz.sha256"
            "$RUNNER_TEMP/dist-linux/crosstalk-$TAG-linux-arm64.tar.gz"
            "$RUNNER_TEMP/dist-linux/crosstalk-$TAG-linux-arm64.tar.gz.sha256"
          )
          repo="$GITHUB_REPOSITORY"
          pre=()
          case "$TAG" in *-rc.*) pre=(--prerelease) ;; esac
          if gh release view "$TAG" --repo "$repo" > /dev/null 2>&1; then
            [ "$(gh release view "$TAG" --repo "$repo" --json isDraft --jq .isDraft)" = true ] || {
              echo "release $TAG is already published; not replacing its assets" >&2
              exit 1
            }
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$repo"
          else
            gh release create "$TAG" "${files[@]}" --draft ${pre[@]+"${pre[@]}"} --verify-tag --generate-notes --title "$TAG" --repo "$repo"
          fi
          gh release edit "$TAG" --draft=false --repo "$repo"
      - name: Remove keychain and key files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/release-secrets"

  marketplace:
    needs: release
    if: needs.release.outputs.final == 'true'
    runs-on: ubuntu-latest
    environment: homebrew-tap
    timeout-minutes: 50
    permissions: {}
    env:
      TAG: ${{ github.ref_name }}
      BRANCH: marketplace-${{ github.ref_name }}
    steps:
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: GoodOlClint
          repositories: CrossTalk
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Bump marketplace refs
        id: bump
        run: |
          set -eu
          out="$(scripts/release-build.sh bump-marketplaces "$TAG")"
          echo "$out"
          if [ "$out" = unchanged ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Test manifests
        if: steps.bump.outputs.changed == 'true'
        run: go test ./cmd/crosstalk -run 'TestManifestsMatchBinary|TestMarketplacesPinToReleaseTag'
      - name: Commit and push branch
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -eu
          url="https://github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code --heads "$url" "$BRANCH" > /dev/null 2>&1; then
            echo "branch $BRANCH exists; land-pr reuses it"
            exit 0
          fi
          git -c user.name='crosstalk-release[bot]' -c user.email='crosstalk-release[bot]@users.noreply.github.com' \
            commit -a -m "marketplaces: pin plugin to $TAG"
          # shellcheck disable=SC2016
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            push "$url" "HEAD:refs/heads/$BRANCH"
      - name: Land pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          scripts/release-build.sh land-pr GoodOlClint/CrossTalk "marketplace-$TAG" "marketplaces: pin plugin to $TAG"
      - name: Confirm refs on main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -eu
          for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json; do
            gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/$f?ref=main" | grep -F "\"ref\": \"$TAG\"" > /dev/null || {
              echo "$f on main does not pin $TAG" >&2
              exit 1
            }
          done

  homebrew:
    needs: [release, marketplace]
    if: needs.release.outputs.final == 'true'
    runs-on: ubuntu-latest
    environment: homebrew-tap
    timeout-minutes: 50
    permissions: {}
    env:
      TAG: ${{ github.ref_name }}
      BRANCH: crosstalk-${{ github.ref_name }}
    steps:
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: GoodOlClint
          repositories: homebrew-tap
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: GoodOlClint/homebrew-tap
          ref: main
          path: tap
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - name: Download and verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          n=0
          for f in ./*.sha256; do
            shasum -a 256 -c "$f"
            n=$((n + 1))
          done
          [ "$n" -eq 3 ]
      - name: Render formula
        id: render
        run: |
          set -eu
          scripts/release-build.sh formula "$TAG" "$RUNNER_TEMP/assets" "$RUNNER_TEMP/assets" > "$RUNNER_TEMP/crosstalk.rb"
          cur="$(sed -n 's|.*/releases/download/v\([0-9.]*\)/.*|\1|p' tap/Formula/crosstalk.rb 2>/dev/null | head -n 1)"
          if [ -n "$cur" ]; then
            newer="$(awk -v a="$cur" -v b="${TAG#v}" 'BEGIN { split(a, x, "."); split(b, y, "."); for (i = 1; i <= 3; i++) if (x[i] + 0 != y[i] + 0) { print (x[i] + 0 > y[i] + 0) ? "cur" : "tag"; exit } }')"
            if [ "$newer" = cur ]; then
              echo "tap main already holds crosstalk $cur, newer than $TAG" >&2
              exit 1
            fi
          fi
          if cmp -s "$RUNNER_TEMP/crosstalk.rb" tap/Formula/crosstalk.rb; then
            echo "tap main already holds this formula"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push branch
        if: steps.render.outputs.changed == 'true'
        working-directory: tap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -eu
          url="https://github.com/GoodOlClint/homebrew-tap.git"
          if git ls-remote --exit-code --heads "$url" "$BRANCH" > /dev/null 2>&1; then
            echo "branch $BRANCH exists; land-pr reuses it"
            exit 0
          fi
          mkdir -p Formula
          cp "$RUNNER_TEMP/crosstalk.rb" Formula/crosstalk.rb
          git add Formula/crosstalk.rb
          git -c user.name='crosstalk-release[bot]' -c user.email='crosstalk-release[bot]@users.noreply.github.com' \
            commit -m "crosstalk ${TAG#v}"
          # shellcheck disable=SC2016
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            push "$url" "HEAD:refs/heads/$BRANCH"
      - name: Land pull request
        if: steps.render.outputs.changed == 'true'
        working-directory: tap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          ../scripts/release-build.sh land-pr GoodOlClint/homebrew-tap "crosstalk-$TAG" "crosstalk ${TAG#v}"
